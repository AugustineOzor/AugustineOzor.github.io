jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AugustineOzor.github.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build site from GitHub repos
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: AugustineOzor.github.io/dist
