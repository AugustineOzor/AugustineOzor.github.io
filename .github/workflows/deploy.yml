name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"   # daily rebuild so new repos appear automatically
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Locate site folder
        id: site
        run: |
          f=$(find . -path ./node_modules -prune -o -path '*/scripts/build.mjs' -print | head -n 1)
          if [ -z "$f" ]; then echo "scripts/build.mjs not found in repo"; exit 1; fi
          dir=$(dirname "$(dirname "$f")")

          echo "Site folder: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: Build site from GitHub repos
        run: node scripts/build.mjs
        working-directory: ${{ steps.site.outputs.dir }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.site.outputs.dir }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
